<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Website</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .custom-marker {
            width: 20px;
            height: 20px;
            background: #ff69b4;
            border: 3px solid #ffff00;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .custom-marker:hover {
            transform: scale(1.3);
        }

        .leaflet-popup-content-wrapper {
            background: #1a1a2e;
            color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .leaflet-popup-tip {
            background: #1a1a2e;
        }

        .leaflet-popup-content {
            margin: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            width: 350px;
        }

        .leaflet-popup-content iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: 4px;
            margin-top: 8px;
        }

        .leaflet-popup-content h3 {
            margin: 0 0 8px 0;
            color: #ff69b4;
            font-size: 16px;
        }

        .leaflet-popup-content p {
            margin: 0;
            color: #cccccc;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on Nicosia, Cyprus (matching the screenshot)
        const map = L.map('map', {
            center: [35.175, 33.365],
            zoom: 14,
            zoomControl: true
        });

        // Dark map tiles (CartoDB Dark Matter) - matches the screenshot style
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Custom marker icon
        const pinIcon = L.divIcon({
            className: 'custom-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -12]
        });

        // Sample locations with info - replace these with your own data
        const locations = [
            {
                lat: 35.1753,
                lng: 33.3620,
                title: "Dionysiou Solomou",
                description: "3D model of Dionysiou Solomou.",
                sketchfabId: "07cc9b7db3b44ca38a96c8f6b5f5e7c4"
            },
            {
                lat: 35.1720,
                lng: 33.3580,
                title: "Location 2",
                description: "Another interesting place to visit.",
                sketchfabId: "f4edc918eb134930b93ab36eb0edf777"
            },
            {
                lat: 35.1780,
                lng: 33.3650,
                title: "Location 3",
                description: "Historical site with cultural significance.",
                sketchfabId: "30f43907f7814582b5dacbbadbabbe6d"
            },
            {
                lat: 35.1700,
                lng: 33.3700,
                title: "Location 4",
                description: "A modern landmark in the city.",
                sketchfabId: "9b55c1e8c1264006b21019f34ce016ac"
            },
            {
                lat: 35.1740,
                lng: 33.3550,
                title: "Location 5",
                description: "Popular gathering spot for locals.",
                sketchfabId: "af096aa7ca934f84b6d64c89a8e312d4"
            },
            {
                lat: 35.1690,
                lng: 33.3630,
                title: "Location 6",
                description: "Architectural gem from the colonial era.",
                sketchfabId: "6c123dc391cc45858e4efa7ffddadbc1"
            },
            {
                lat: 35.1760,
                lng: 33.3700,
                title: "Location 7",
                description: "Recently restored monument.",
                sketchfabId: "2593a49465a74ea09c43f26e53957708"
            }
        ];

        // Add markers to the map
        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map);
            let popupContent = `<h3>${loc.title}</h3><p>${loc.description}</p>`;
            if (loc.sketchfabId) {
                popupContent += `<iframe title="${loc.title}" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" src="https://sketchfab.com/models/${loc.sketchfabId}/embed"></iframe>`;
            }
            marker.bindPopup(popupContent, { maxWidth: 400 });
        });
    </script>
</body>
</html>
